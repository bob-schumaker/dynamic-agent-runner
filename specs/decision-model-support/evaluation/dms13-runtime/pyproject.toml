[tool.poetry]
name = "dms13-local-evaluation-runtime"
version = "0.1.0"
description = "Pinned direct-local DMS-13 compactor and reader runtime"
authors = ["Dynamic Agent Runner"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14.7,<3.15"
accelerate = "1.15.0"
huggingface-hub = "1.32.0"
mlx = "0.32.2"
mlx-lm = "0.31.3"
numpy = "2.5.3"
openai = "2.54.0"
tokenizers = "0.23.2"
torch = "2.14.0"
transformers = "5.17.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
