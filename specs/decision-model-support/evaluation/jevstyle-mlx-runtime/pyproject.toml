[tool.poetry]
name = "dms-jevstyle-mlx-runtime"
version = "0.1.0"
description = "Isolated DMS-06 Jev-Style MLX evaluation runtime"
authors = ["Dynamic Agent Runner"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
huggingface-hub = "1.33.0"
mlx = "0.32.2"
mlx-lm = "0.31.3"
numpy = "2.5.3"
tokenizers = "0.23.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
