[tools]
# dot-mise-toml-tools:start -- DO NOT EDIT BETWEEN THESE COMMENTS
python = "3.14.7"
# dot-mise-toml-tools:end -- DO NOT EDIT BETWEEN THESE COMMENTS

# dot-mise-poetry-tools:start -- DO NOT EDIT BETWEEN THESE COMMENTS
"pipx:poetry" = { version = "latest", pyproject = "{{ config_root }}/pyproject.toml" }
# dot-mise-poetry-tools:end -- DO NOT EDIT BETWEEN THESE COMMENTS
[env]
# dot-mise-toml-env:start -- DO NOT EDIT BETWEEN THESE COMMENTS

# dot-mise-toml-env:end -- DO NOT EDIT BETWEEN THESE COMMENTS

# dot-mise-poetry-env:start -- DO NOT EDIT BETWEEN THESE COMMENTS
POETRY_ACTIVE = true
POETRY_REQUESTS_TIMEOUT = 60
POETRY_VIRTUALENVS_IN_PROJECT = true
# dot-mise-poetry-env:end -- DO NOT EDIT BETWEEN THESE COMMENTS
[_.python]
# dot-mise-python-venv:start -- DO NOT EDIT BETWEEN THESE COMMENTS
venv = ".venv"
# dot-mise-python-venv:end -- DO NOT EDIT BETWEEN THESE COMMENTS

[tasks."project-update"]
# dot-mise-project-update-task:start -- DO NOT EDIT BETWEEN THESE COMMENTS
run = "poetry update --with dev --with docs --with test --sync"
# dot-mise-project-update-task:end -- DO NOT EDIT BETWEEN THESE COMMENTS

[hooks.enter]
# dot-mise-enter:start -- DO NOT EDIT BETWEEN THESE COMMENTS
shell = "sh"
script = '''
if [ -d "${MISE_PROJECT_ROOT}/.venv" ]; then
    VIRTUAL_ENV="${MISE_PROJECT_ROOT}/.venv"
    export VIRTUAL_ENV
    case ":${PATH:-}:" in
        *:"${VIRTUAL_ENV}/bin":*) ;;
        *) PATH="${VIRTUAL_ENV}/bin${PATH:+:${PATH}}"; export PATH ;;
    esac
    if command -v set_project_path >/dev/null 2>&1; then
        set_project_path "${MISE_PROJECT_ROOT}" "${VIRTUAL_ENV}"
    fi
fi
'''
# dot-mise-enter:end -- DO NOT EDIT BETWEEN THESE COMMENTS

[hooks.leave]
# dot-mise-leave:start -- DO NOT EDIT BETWEEN THESE COMMENTS
shell = "sh"
script = '''
if [ -n "${VIRTUAL_ENV:-}" ]; then
    env_tools_mise_previous_path="${PATH:-}"
    PATH=$(printf '%s\n' "$env_tools_mise_previous_path" | awk -v RS=: -v ORS=: -v target="${VIRTUAL_ENV}/bin" '$0 != target && $0 != "" { print }')
    PATH="${PATH%:}"
    export PATH
fi
unset VIRTUAL_ENV
'''
# dot-mise-leave:end -- DO NOT EDIT BETWEEN THESE COMMENTS
