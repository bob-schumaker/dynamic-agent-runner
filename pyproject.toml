[project]
name = "dynamic-agent-runner"
version = "0.1.18"
description = ""
authors = [
    {name = "Bob Schumaker",email = "bob.schumaker@oracle.com"}
]
dynamic = ["dependencies", "requires-python"]

[project.scripts]
dynamic-agent-runner = "dynamic_agent_runner.cli:console_main"
dynamic-agent-runner-mcp = "dynamic_agent_runner.mcp_server:console_main"
dar-package = "dynamic_agent_runner.dar_package_cli:console_main"
dar-workflow = "dynamic_agent_runner.workflow_host.cli:console_main"
dar-workflow-run = "dynamic_agent_runner.workflow_host.cli:run_console_main"
graphify-extract = "dynamic_agent_runner.tools.graphify_cli:console_main"

[project.entry-points.pyinstaller40]
hook-dirs = "dynamic_agent_runner.__pyinstaller:get_hook_dirs"

[project.optional-dependencies]
huggingface = ["huggingface-hub>=1.18.0,<2.0.0"]
llamacpp = ["llama-cpp-python>=0.3.29,<0.4.0"]
apple-foundation-models = ["apple-fm-sdk>=0.2.0"]
mlx = ["mlx-lm>=0.31.3,<0.32.0"]
mlx-embedding = ["mlx==0.32.2; platform_system == 'Darwin'"]
transformers-peft = [
    "transformers>=5.0.0,<6.0.0",
    "peft>=0.19.1,<0.20.0",
    "torch>=2.9.0,<3.0.0",
    "Pillow>=11.0.0,<12.0.0",
    "torchvision>=0.24.0,<0.29.0",
    "lm-format-enforcer>=0.11.3,<0.12.0",
]

[tool.poetry]
packages = [
    { include = "dynamic_agent_runner", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14.1 || >3.14.1,<3.15"
openai = "^2.41.1"
litellm = "^1.97.0"
cryptography = ">=49.0.0,<50.0.0"
keyring = ">=25.7.0"
jsonschema = ">=4.26.0,<5.0.0"
PyYAML = ">=6.0.3"
tenacity = ">=9.1.4"
tiktoken = ">=0.13.0"
openai-model-registry = "^1.0.5"
llama-cpp-python = {version = "^0.3.29", optional = true}
huggingface-hub = {version = "^1.18.0", optional = true}
apple-fm-sdk = {version = ">=0.2.0", optional = true}
mlx-lm = {version = ">=0.31.3,<0.32.0", optional = true}
mlx = {version = "0.32.2", optional = true, markers = "platform_system == 'Darwin' and extra == 'mlx-embedding'"}
transformers = {version = ">=5.0.0,<6.0.0", optional = true}
peft = {version = ">=0.19.1,<0.20.0", optional = true}
torch = {version = ">=2.9.0,<3.0.0", optional = true}
Pillow = {version = ">=11.0.0,<12.0.0", optional = true}
torchvision = {version = ">=0.24.0,<0.29.0", optional = true}
lm-format-enforcer = {version = ">=0.11.3,<0.12.0", optional = true}

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pipdeptree = "*"
tqdm = ">=4.66"
ruff = "^0.15.10"
pre-commit = "^4.5.1"
isort = "^8.0.1"
llama-cpp-python = "^0.3.29"
huggingface-hub = "^1.18.0"
apple-fm-sdk = ">=0.2.0"
mlx-lm = ">=0.31.3,<0.32.0"
marketplace-installer = "0.1.2"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinxcontrib-confluencebuilder = "*"
myst-parser = "*"
sphinx-markdown-builder = "^0.6.10"
werner = {extras = ["login"], version = "^0.4.216"}

[tool.poetry.group.test.dependencies]
pytest-cov = "^7.1.0"
pytest-parallel = "^0.1.1"
nltk = "^3.9.3"

[[tool.poetry.source]]
name = 'global-release-pypi'
url = 'https://artifactory.oci.oraclecorp.com/api/pypi/global-release-pypi/simple'
priority = "primary"

[[tool.poetry.source]]
name = 'global-dev-pypi'
url = 'https://artifactory.oci.oraclecorp.com/api/pypi/global-dev-pypi/simple'
priority = "supplemental"

[tool.pyright.defineConstant]
PYQT5 = false
PYSIDE2 = false
PYQT6 = false
PYSIDE6 = true

[build-system]
requires = ["poetry>=1.0.0"]
build-backend = "poetry.masonry.api"

[tool.pytest.ini_options]
addopts = "-m 'not apple_live'"
testpaths = ["tests"]
markers = [
    "apple_live: live Apple Foundation Models test on an eligible Mac",
    "live_matrix: explicitly authorized live model-interface matrix test",
]
norecursedirs = [
    "litellm",
    "input_ocibuild",
    "output_ocibuild_packagewheel",
]

# Build trigger marker: force OCI build for cached inventory slice. 2026-06-23.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "C", "E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
