[project]
name = "dynamic-agent-runner"
version = "0.1.0"
description = ""
authors = [
    {name = "Bob Schumaker",email = "bob.schumaker@oracle.com"}
]
dynamic = ["dependencies", "requires-python"]

[project.scripts]
dynamic-agent-runner = "dynamic_agent_runner.cli:console_main"

[project.optional-dependencies]
huggingface = ["huggingface-hub>=1.18.0,<2.0.0"]

[tool.poetry]
packages = [
    { include = "dynamic_agent_runner", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14.1 || >3.14.1,<3.15"
openai = "^2.41.0"
PyYAML = ">=6.0.3"
tenacity = ">=9.1.4"
tiktoken = ">=0.13.0"
openai-model-registry = "^1.0.5"
llama-cpp-python = "^0.3.28"
huggingface-hub = {version = "^1.18.0", optional = true}

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pipdeptree = "*"
tqdm = ">=4.66"
ruff = "^0.15.10"
pre-commit = "^4.5.1"
isort = "^8.0.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinxcontrib-confluencebuilder = "*"
myst-parser = "*"
sphinx-markdown-builder = "^0.6.10"

[tool.poetry.group.test.dependencies]
pytest-cov = "^7.1.0"
pytest-parallel = "^0.1.1"

[[tool.poetry.source]]
name = 'global-release-pypi'
url = 'https://artifactory.oci.oraclecorp.com/api/pypi/global-release-pypi/simple'
priority = "primary"

[[tool.poetry.source]]
name = 'global-dev-pypi'
url = 'https://artifactory.oci.oraclecorp.com/api/pypi/global-dev-pypi/simple'
priority = "supplemental"

[tool.pyright.defineConstant]
PYQT5 = false
PYSIDE2 = false
PYQT6 = false
PYSIDE6 = true

[build-system]
requires = ["poetry>=1.0.0"]
build-backend = "poetry.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "C", "E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
