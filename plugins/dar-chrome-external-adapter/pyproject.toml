[project]
name = "dar-chrome-external-adapter"
version = "0.1.0"
description = "Optional DAR adapter for Chrome Built-in AI"
requires-python = ">=3.13,<3.15"
dependencies = ["dynamic-agent-runner>=0.2.21"]

[tool.poetry]
packages = [{ include = "dar_chrome_external_adapter" }]
include = [{ path = "dar_external_adapter.json", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
dynamic-agent-runner = { path = "../..", develop = true, python = ">=3.13,<3.14.1 || >3.14.1,<3.15" }

[tool.poetry.group.test.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry>=1.0.0"]
build-backend = "poetry.masonry.api"
