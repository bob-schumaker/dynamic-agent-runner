format_version: 1
package_id: dar-authoring-write-mcp-template
purpose: Send one bounded email through a reviewed host-owned MCP capability.
dar_runtime:
  distribution: dynamic-agent-runner
  required_version: 0.1.21
model:
  profile_requirement: local-general-model
skills: []
tools:
  - id: mail_send
    kind: mcp
    remote_tool_name: send_email
    side_effect: write
    approval_required: true
workspace:
  accepted_input_types: [text/plain]
  scratch_access: none
input_contract:
  mode: hybrid
  structured_input_schema: null
  additional_context_max_bytes: 8192
  field_precedence: original_prompt
task_invocation:
  entrypoint: answer_request
  allowed_tool_ids: [mail_send]
  max_total_tool_calls: 1
  allowed_structured_input_fields: []
  allowed_artifact_roles: []
  argument_sources:
    mail_send:
      recipient:
        sources: [cited_original_prompt_span]
        authority: true
      body:
        sources: [cited_original_prompt_span]
        authority: false
  terminal_output_schema_ref: final_answer
output:
  schema_ref: final_answer
limits:
  max_steps: 3
