format_version: 1
package_id: floorplan-from-image
purpose: Turn one sealed image into one validated SVG floorplan.
dar_runtime:
  distribution: dynamic-agent-runner
  required_version: 0.1.17
model:
  profile_requirement: local-multimodal-model-v1
skills: []
tools: []
workspace:
  accepted_input_types: [image/jpeg, image/png]
  scratch_access: none
input_contract:
  mode: hybrid
  structured_input_schema: null
  additional_context_max_bytes: 8192
  field_precedence: original_prompt
task_invocation:
  entrypoint: answer_request
  allowed_tool_ids: []
  max_total_tool_calls: 0
  allowed_structured_input_fields: []
  allowed_artifact_roles: [source_image]
  terminal_output_schema_ref: svg_floorplan
output:
  schema_ref: svg_floorplan
  processors:
    - asset_path: tools/render_floorplan_json
      max_output_bytes: 32768
      timeout_seconds: 1
  validator:
    asset_path: tools/validate_svg
    max_output_bytes: 512
    timeout_seconds: 1
input_converter:
  converter_id: qwen25-vl-3b-grpo-input-v1
  converter_contract_version: v1
  compatible_runner_contract_id: transformers-generate-v1
  entrypoint: assets/qwen25_vl_3b_grpo_converter.py
  asset_digest: 8d8c0b1fbb68d39fa98a6ca1257c0e7c7cbae749c9c3eb91e54d88c7c635df21
  declared_resource_limits:
    max_input_bytes: 8388608
    max_output_bytes: 33554432
    timeout_seconds: 1
limits:
  max_steps: 2
