format_version: 1
package_type: dynamic_agent_design
package_id: hello-world-workflow-orchestration-agent
name: Hello World Workflow Orchestration Agent
description: Hello-world test resource for the Workflow Orchestration Agent pattern.
entrypoint: check_status
mermaid_diagram: agent-graph.mmd

packaging:
  mode: hybrid_bundle
  skill_bundle_dir: skill-bundle

patterns_present:
  - workflow-orchestration-agent

execution_policy:
  autonomy_level: bounded autonomous
  allowed_execution_modes:
    - sequential_fallback
  external_backend_allowed: no
  max_iterations: 3
  timeout: runtime_default
  approval_required_for:
    - live write or mutation
  forbidden_actions:
    - store secrets in prompts or logs
  model: gpt-test

state:
  artifacts:
    - id: user_request
      description: Original hello-world request.
      source: user
    - id: hello_message
      description: Final hello-world response.
      source: llm
  mutable_fields:
    - hello_message

skills:
  - id: agent-development
    label: Agent development skill
    source_type: repo_skill
    source_path: skills/agent-development-skill/SKILL.md
    packaging_mode: referenced_only
    notes: Provides agent pattern vocabulary for this fixture.

tools:
  - id: status_hello
    label: Status Hello
    description_for_llm: |
      Hello-world fixture tool for the status_hello capability.
    adapter: fixtures.status_hello
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
        - query
    output_schema:
      type: object
      properties:
        message:
          type: string
    side_effect: read
    approval_required: no
    timeout: runtime_default
    retry_policy: none
    failure_behavior: fallback

participant_groups: []

modes:
  - id: default
    description: Hello-world fixture mode for Workflow Orchestration Agent.
    enabled_phases:
      - hello
    batching_allowed: false

phases:
  - id: hello
    label: Hello phase
    phase_kind: preparation
    repeatable: false
    participant_group: null
    peer_visibility: none
    enabled_when: always

roles:
  - id: hello_designer
    label: Hello designer

nodes:
  - id: check_status
    kind: tool_use_step
    label: Check status
    tool_id: status_hello
    inputs:
      query: hello workflow
    failure_behavior: fallback
    outputs:
      state_key: check_status_result
  - id: route_workflow
    kind: decision_step
    label: Route workflow
    decision_subtype: llm_route
    route_from: check_status
    decision_contract:
      allowed_paths:
        - id: proceed
          target: hello_done
      default_path: proceed
  - id: draft_update
    kind: llm_step
    label: Draft update
    model: gpt-test
    prompt:
      user_template: |
        Say hello from workflow status: {check_status}
      input_vars:
        - prompt
      output_schema_ref: hello_message

edges:
  - source: check_status
    target: route_workflow
    edge_kind: sequential
  - source: route_workflow
    target: draft_update
    edge_kind: branch
    condition: proceed

output_contracts:
  hello_message:
    required_fields:
      - message
    validation: fixture_load_check

validation:
  package_checks:
    - Every node id is unique.
    - Every edge endpoint references an existing node.
    - Every llm_step has a prompt or a prompt_source.
