format_version: 1
package_type: dynamic_agent_design
package_id: hello-world-tool-based-function-calling-agent
name: Hello World Tool Based Function Calling Agent
description: Hello-world test resource for the Tool Based Function Calling Agent pattern.
entrypoint: plan_tool_call
mermaid_diagram: agent-graph.mmd
packaging:
  mode: hybrid_bundle
  skill_bundle_dir: skill-bundle
runtime:
  execution_policy:
    autonomy_level: supervised agent
    allowed_execution_modes:
    - sequential_fallback
    external_backend_allowed: false
    max_iterations: 3
    timeout: runtime_default
    approval_required_for:
    - live write or mutation
    forbidden_actions:
    - store secrets in prompts or logs
    model: gpt-test
  state:
    artifacts:
    - id: user_request
      description: Original hello-world request.
      source: user
    - id: hello_message
      description: Final hello-world response.
      source: llm
    mutable_fields:
    - hello_message
metadata:
  patterns_present:
  - tool-based-function-calling-agent
  participant_groups: []
  modes:
  - id: default
    description: Hello-world fixture mode for Tool Based Function Calling Agent.
    enabled_phases:
    - hello
    batching_allowed: false
  phases:
  - id: hello
    label: Hello phase
    phase_kind: preparation
    repeatable: false
    participant_group: null
    peer_visibility: none
    enabled_when: always
  roles:
  - id: hello_designer
    label: Hello designer
extensions: {}
skills:
- id: agent-development
  label: Agent development skill
  source_type: repo_skill
  source_path: skills/agent-development-skill/SKILL.md
  packaging_mode: referenced_only
  notes: Provides agent pattern vocabulary for this fixture.
tools:
- id: hello_lookup
  label: Hello Lookup
  description_for_llm: 'Hello-world fixture tool for the hello_lookup capability.

    '
  adapter: fixtures.hello_lookup
  input_schema:
    type: object
    properties:
      query:
        type: string
    required:
    - query
  output_schema:
    type: object
    properties:
      message:
        type: string
  side_effect: read
  approval_required: false
  timeout: runtime_default
  retry_policy: none
  failure_behavior: fallback
nodes:
- id: plan_tool_call
  kind: llm_step
  label: Plan tool call
  model: gpt-test
  prompt:
    system: 'You are a tool-calling hello-world agent.

      '
    user_template: 'Plan a hello lookup for: {prompt}

      '
    input_vars:
    - prompt
    output_schema_ref: hello_message
  available_tools:
  - hello_lookup
- id: lookup_hello
  kind: tool_use_step
  label: Lookup hello
  tool_id: hello_lookup
  inputs:
    query: hello
  failure_behavior: fallback
  outputs:
    state_key: lookup_hello_result
- id: summarize_tool_result
  kind: llm_step
  label: Summarize tool result
  model: gpt-test
  prompt:
    user_template: 'Say hello using tool result: {lookup_hello}

      '
    input_vars:
    - prompt
    output_schema_ref: hello_message
edges:
- source: plan_tool_call
  target: lookup_hello
  edge_kind: sequential
- source: lookup_hello
  target: summarize_tool_result
  edge_kind: sequential
output_contracts:
- id: hello_message
  required_fields:
  - message
  validation: fixture_load_check
validation:
  package_checks:
  - Every node id is unique.
  - Every edge endpoint references an existing node.
  - Every llm_step has a prompt or a prompt_source.
