format_version: 1
package_type: dynamic_agent_design
package_id: hello-world-tool-server-or-mcp-style-agent
name: Hello World Tool Server Or MCP Style Agent
description: Hello-world test resource for the Tool Server Or MCP Style Agent pattern.
entrypoint: inspect_capability
mermaid_diagram: agent-graph.mmd
packaging:
  mode: hybrid_bundle
  skill_bundle_dir: skill-bundle
runtime:
  execution_policy:
    autonomy_level: assistive
    allowed_execution_modes:
    - sequential_fallback
    external_backend_allowed: false
    max_iterations: 3
    timeout: runtime_default
    approval_required_for:
    - live write or mutation
    forbidden_actions:
    - store secrets in prompts or logs
    model: gpt-test
  state:
    artifacts:
    - id: user_request
      description: Original hello-world request.
      source: user
    - id: hello_message
      description: Final hello-world response.
      source: llm
    mutable_fields:
    - hello_message
metadata:
  patterns_present:
  - tool-server-or-mcp-style-agent
  participant_groups: []
  modes:
  - id: default
    description: Hello-world fixture mode for Tool Server Or MCP Style Agent.
    enabled_phases:
    - hello
    batching_allowed: false
  phases:
  - id: hello
    label: Hello phase
    phase_kind: preparation
    repeatable: false
    participant_group: null
    peer_visibility: none
    enabled_when: always
  roles:
  - id: hello_designer
    label: Hello designer
extensions: {}
skills:
- id: agent-development
  label: Agent development skill
  source_type: repo_skill
  source_path: skills/agent-development-skill/SKILL.md
  packaging_mode: referenced_only
  notes: Provides agent pattern vocabulary for this fixture.
tools:
- id: mcp_hello_read
  label: Mcp Hello Read
  description_for_llm: 'Hello-world fixture tool for the mcp_hello_read capability.

    '
  adapter: fixtures.mcp_hello_read
  input_schema:
    type: object
    properties:
      query:
        type: string
    required:
    - query
  output_schema:
    type: object
    properties:
      message:
        type: string
  side_effect: read
  approval_required: false
  timeout: runtime_default
  retry_policy: none
  failure_behavior: fallback
nodes:
- id: inspect_capability
  kind: tool_use_step
  label: Inspect MCP capability
  tool_id: mcp_hello_read
  inputs:
    query: hello
  failure_behavior: fallback
  outputs:
    state_key: inspect_capability_result
- id: draft_source_summary
  kind: llm_step
  label: Draft source summary
  model: gpt-test
  prompt:
    system: 'You summarize MCP-style source evidence.

      '
    user_template: 'Say hello using source evidence: {inspect_capability}

      '
    input_vars:
    - prompt
    output_schema_ref: hello_message
edges:
- source: inspect_capability
  target: draft_source_summary
  edge_kind: sequential
output_contracts:
- id: hello_message
  required_fields:
  - message
  validation: fixture_load_check
validation:
  package_checks:
  - Every node id is unique.
  - Every edge endpoint references an existing node.
  - Every llm_step has a prompt or a prompt_source.
