format_version: 1
package_type: dynamic_agent_design
package_id: hello-world-multi-agent-collaboration
name: Hello World Multi Agent Collaboration
description: Hello-world test resource for the Multi Agent Collaboration pattern.
entrypoint: architect_hello
mermaid_diagram: agent-graph.mmd

packaging:
  mode: hybrid_bundle
  skill_bundle_dir: skill-bundle

patterns_present:
  - multi-agent-collaboration

execution_policy:
  autonomy_level: assistive
  allowed_execution_modes:
    - sequential_fallback
  external_backend_allowed: no
  max_iterations: 3
  timeout: runtime_default
  approval_required_for:
    - live write or mutation
  forbidden_actions:
    - store secrets in prompts or logs
  model: gpt-test

state:
  artifacts:
    - id: user_request
      description: Original hello-world request.
      source: user
    - id: hello_message
      description: Final hello-world response.
      source: llm
  mutable_fields:
    - hello_message

skills:
  - id: agent-development
    label: Agent development skill
    source_type: repo_skill
    source_path: skills/agent-development-skill/SKILL.md
    packaging_mode: referenced_only
    notes: Provides agent pattern vocabulary for this fixture.

tools: []

participant_groups:
  - id: hello_panel
    name: Hello panel

modes:
  - id: default
    description: Hello-world fixture mode for Multi Agent Collaboration.
    enabled_phases:
      - hello
    batching_allowed: false

phases:
  - id: hello
    label: Hello phase
    phase_kind: parallel_fanout
    repeatable: false
    participant_group: hello_panel
    peer_visibility: none
    enabled_when: always

roles:
  - id: architect
    label: Architect
  - id: security
    label: Security
  - id: synthesizer
    label: Synthesizer

nodes:
  - id: architect_hello
    kind: llm_step
    label: Architect hello
    role: architect
    model: gpt-test
    prompt:
      system: |
        You are the architect reviewer.
      user_template: |
        Architect says hello about: {prompt}
      input_vars:
        - prompt
      output_schema_ref: hello_message
  - id: security_hello
    kind: llm_step
    label: Security hello
    role: security
    model: gpt-test
    prompt:
      system: |
        You are the security reviewer.
      user_template: |
        Security says hello about: {prompt}
      input_vars:
        - prompt
      output_schema_ref: hello_message
  - id: synthesize_panel
    kind: llm_step
    label: Synthesize panel
    role: synthesizer
    model: gpt-test
    prompt:
      user_template: |
        Synthesize hello from {architect_hello} and {security_hello}
      input_vars:
        - prompt
      output_schema_ref: hello_message

edges:
  - source: architect_hello
    target: synthesize_panel
    edge_kind: parallel_join
  - source: security_hello
    target: synthesize_panel
    edge_kind: parallel_join

output_contracts:
  hello_message:
    required_fields:
      - message
    validation: fixture_load_check

validation:
  package_checks:
    - Every node id is unique.
    - Every edge endpoint references an existing node.
    - Every llm_step has a prompt or a prompt_source.
