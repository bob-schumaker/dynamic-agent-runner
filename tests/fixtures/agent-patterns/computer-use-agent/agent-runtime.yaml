format_version: 1
package_type: dynamic_agent_design
package_id: hello-world-computer-use-agent
name: Hello World Computer Use Agent
description: Hello-world test resource for the Computer Use Agent pattern.
entrypoint: observe_screen
mermaid_diagram: agent-graph.mmd
packaging:
  mode: hybrid_bundle
  skill_bundle_dir: skill-bundle
runtime:
  execution_policy:
    autonomy_level: supervised_agent
    allowed_execution_modes:
    - sequential_fallback
    external_backend_allowed: false
    max_iterations: 3
    max_steps: 5
    timeout: runtime_default
    exit_strategy:
      terminal_conditions:
      - hello_message emitted
      - validation failure or unavailable fixture context
      on_exhaustion: escalate
      ambiguous_completion: clarify
    approval_required_for:
    - live write or mutation
    forbidden_actions:
    - store secrets in prompts or logs
    model: gpt-test
  state:
    artifacts:
    - id: user_request
      description: Original hello-world request.
      source: user
    - id: hello_message
      description: Final hello-world response.
      source: llm
    mutable_fields:
    - hello_message
metadata:
  patterns_present:
  - computer-use-agent
  participant_groups: []
  modes:
  - id: default
    description: Hello-world fixture mode for Computer Use Agent.
    enabled_phases:
    - hello
    batching_allowed: false
  phases:
  - id: hello
    label: Hello phase
    phase_kind: preparation
    repeatable: false
    participant_group: null
    peer_visibility: none
    enabled_when: always
  roles:
  - id: hello_designer
    label: Hello designer
extensions: {}
skills:
- id: agent-development
  label: Agent development skill
  source_type: repo_skill
  source_path: corpus/capabilities/agent-development/SKILL.md
  packaging_mode: referenced_only
  notes: Provides agent pattern vocabulary for this fixture.
tools:
- id: screenshot_hello
  label: Screenshot Hello
  tool_type: external_api
  description_for_llm: 'Hello-world fixture tool for the screenshot_hello capability.

    '
  adapter: fixtures.screenshot_hello
  input_schema:
    type: object
    properties:
      query:
        type: string
    required:
    - query
  output_schema:
    type: object
    properties:
      message:
        type: string
  side_effect: read
  approval_required: false
  timeout: runtime_default
  retry_policy: none
  failure_behavior: fallback
nodes:
- id: observe_screen
  kind: tool_use_step
  label: Observe screen
  tool_id: screenshot_hello
  inputs:
    query: hello screen
  failure_behavior: fallback
  outputs:
    state_key: observe_screen_result
- id: plan_ui_action
  kind: llm_step
  label: Plan UI action
  model: gpt-test
  prompt:
    system: 'You plan safe UI actions only.

      '
    user_template: 'Say hello based on observed screen: {observe_screen}

      '
    input_vars:
    - prompt
    output_schema_ref: hello_message
- id: confirm_safe
  kind: decision_step
  label: Confirm safe route
  decision_subtype: llm_route
  route_from: plan_ui_action
  prompt:
    user_template: 'Route the hello-world computer-use fixture result.

      '
    input_vars:
    - prompt
  decision_contract:
    allowed_paths:
    - id: proceed
      target: hello_done
    default_path: proceed
- id: report_ui_plan
  kind: llm_step
  label: Report UI plan
  model: gpt-test
  prompt:
    user_template: 'Hello from a supervised UI plan.

      '
    input_vars:
    - prompt
    output_schema_ref: hello_message
edges:
- from: observe_screen
  to: plan_ui_action
  edge_kind: sequential
- from: plan_ui_action
  to: confirm_safe
  edge_kind: sequential
- from: confirm_safe
  to: report_ui_plan
  edge_kind: branch
  condition: proceed
output_contracts:
- id: hello_message
  required_fields:
  - message
  validation: fixture_load_check
validation:
  package_checks:
  - Every node id is unique.
  - Every edge endpoint references an existing node.
  - Every llm_step has a prompt or a prompt_source.
