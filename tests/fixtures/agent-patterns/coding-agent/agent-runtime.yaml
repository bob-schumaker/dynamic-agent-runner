format_version: 1
package_type: dynamic_agent_design
package_id: hello-world-coding-agent
name: Hello World Coding Agent
description: Hello-world test resource for the Coding Agent pattern.
entrypoint: read_repo
mermaid_diagram: agent-graph.mmd

packaging:
  mode: hybrid_bundle
  skill_bundle_dir: skill-bundle

patterns_present:
  - coding-agent

execution_policy:
  autonomy_level: supervised agent
  allowed_execution_modes:
    - sequential_fallback
  external_backend_allowed: no
  max_iterations: 3
  timeout: runtime_default
  approval_required_for:
    - live write or mutation
  forbidden_actions:
    - store secrets in prompts or logs
  model: gpt-test

state:
  artifacts:
    - id: user_request
      description: Original hello-world request.
      source: user
    - id: hello_message
      description: Final hello-world response.
      source: llm
  mutable_fields:
    - hello_message

skills:
  - id: agent-development
    label: Agent development skill
    source_type: repo_skill
    source_path: skills/agent-development-skill/SKILL.md
    packaging_mode: referenced_only
    notes: Provides agent pattern vocabulary for this fixture.

tools:
  - id: read_hello_file
    label: Read Hello File
    description_for_llm: |
      Hello-world fixture tool for the read_hello_file capability.
    adapter: fixtures.read_hello_file
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
        - query
    output_schema:
      type: object
      properties:
        message:
          type: string
    side_effect: read
    approval_required: no
    timeout: runtime_default
    retry_policy: none
    failure_behavior: fallback

participant_groups: []

modes:
  - id: default
    description: Hello-world fixture mode for Coding Agent.
    enabled_phases:
      - hello
    batching_allowed: false

phases:
  - id: hello
    label: Hello phase
    phase_kind: preparation
    repeatable: false
    participant_group: null
    peer_visibility: none
    enabled_when: always

roles:
  - id: hello_designer
    label: Hello designer

nodes:
  - id: read_repo
    kind: tool_use_step
    label: Read repo
    tool_id: read_hello_file
    inputs:
      query: README
    failure_behavior: fallback
    outputs:
      state_key: read_repo_result
  - id: draft_patch_plan
    kind: llm_step
    label: Draft patch plan
    model: gpt-test
    prompt:
      system: |
        You are a coding hello-world agent.
      user_template: |
        Say hello and propose a safe patch from: {read_repo}
      input_vars:
        - prompt
      output_schema_ref: hello_message
  - id: validation_gate
    kind: decision_step
    label: Validation gate
    decision_subtype: llm_route
    route_from: draft_patch_plan
    decision_contract:
      allowed_paths:
        - id: proceed
          target: hello_done
      default_path: proceed

edges:
  - source: read_repo
    target: draft_patch_plan
    edge_kind: sequential
  - source: draft_patch_plan
    target: validation_gate
    edge_kind: sequential

output_contracts:
  hello_message:
    required_fields:
      - message
    validation: fixture_load_check

validation:
  package_checks:
    - Every node id is unique.
    - Every edge endpoint references an existing node.
    - Every llm_step has a prompt or a prompt_source.
