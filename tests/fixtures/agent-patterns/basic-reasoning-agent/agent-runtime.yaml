format_version: 1
package_type: dynamic_agent_design
package_id: hello-world-basic-reasoning-agent
name: Hello World Basic Reasoning Agent
description: Hello-world test resource for the Basic Reasoning Agent pattern.
entrypoint: reason_about_request
mermaid_diagram: agent-graph.mmd
packaging:
  mode: hybrid_bundle
  skill_bundle_dir: skill-bundle
runtime:
  execution_policy:
    autonomy_level: assistive
    allowed_execution_modes:
    - sequential_fallback
    external_backend_allowed: false
    max_iterations: 3
    timeout: runtime_default
    approval_required_for:
    - live write or mutation
    forbidden_actions:
    - store secrets in prompts or logs
    model: gpt-test
  state:
    artifacts:
    - id: user_request
      description: Original hello-world request.
      source: user
    - id: hello_message
      description: Final hello-world response.
      source: llm
    mutable_fields:
    - hello_message
metadata:
  patterns_present:
  - basic-reasoning-agent
  participant_groups: []
  modes:
  - id: default
    description: Hello-world fixture mode for Basic Reasoning Agent.
    enabled_phases:
    - hello
    batching_allowed: false
  phases:
  - id: hello
    label: Hello phase
    phase_kind: preparation
    repeatable: false
    participant_group: null
    peer_visibility: none
    enabled_when: always
  roles:
  - id: hello_designer
    label: Hello designer
extensions: {}
skills:
- id: agent-development
  label: Agent development skill
  source_type: repo_skill
  source_path: skills/agent-development-skill/SKILL.md
  packaging_mode: referenced_only
  notes: Provides agent pattern vocabulary for this fixture.
tools: []
nodes:
- id: reason_about_request
  kind: llm_step
  label: Reason about request
  model: gpt-test
  prompt:
    system: 'You are a basic reasoning hello-world agent.

      '
    user_template: 'Say hello and explain this request: {prompt}

      '
    input_vars:
    - prompt
    output_schema_ref: hello_message
edges: []
output_contracts:
- id: hello_message
  required_fields:
  - message
  validation: fixture_load_check
validation:
  package_checks:
  - Every node id is unique.
  - Every edge endpoint references an existing node.
  - Every llm_step has a prompt or a prompt_source.
