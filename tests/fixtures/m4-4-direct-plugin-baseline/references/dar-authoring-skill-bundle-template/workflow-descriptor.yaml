format_version: 1
package_id: dar-authoring-skill-bundle-template
purpose: Review one bounded user request with one package-local skill and no tools.
dar_runtime:
  distribution: dynamic-agent-runner
  required_version: 0.1.18
model:
  profile_requirement: local-general-model
skills:
  - review-guide
tools: []
workspace:
  accepted_input_types: [text/plain]
  scratch_access: none
input_contract:
  mode: hybrid
  structured_input_schema: null
  additional_context_max_bytes: 8192
  field_precedence: original_prompt
task_invocation:
  entrypoint: route_request
  allowed_tool_ids: []
  max_total_tool_calls: 0
  allowed_structured_input_fields: []
  allowed_artifact_roles: []
  terminal_output_schema_ref: final_answer
output:
  schema_ref: final_answer
limits:
  max_steps: 4
