format_version: 1
package_id: dar-authoring-read-only-mcp-template
purpose: Answer one bounded user request with one reviewed read-only MCP tool.
dar_runtime:
  distribution: dynamic-agent-runner
  required_version: 0.1.17
model:
  profile_requirement: local-general-model
skills: []
tools:
  - id: lookup_records
    kind: mcp
    remote_tool_name: lookup_records
    side_effect: read
workspace:
  accepted_input_types: [text/plain]
  scratch_access: none
input_contract:
  mode: hybrid
  structured_input_schema: null
  additional_context_max_bytes: 8192
  field_precedence: original_prompt
task_invocation:
  entrypoint: answer_request
  allowed_tool_ids: [lookup_records]
  max_total_tool_calls: 3
  allowed_structured_input_fields: []
  allowed_artifact_roles: []
  terminal_output_schema_ref: final_answer
output:
  schema_ref: final_answer
limits:
  max_steps: 3
