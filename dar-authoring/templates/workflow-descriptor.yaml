format_version: 1
package_id: dar-authoring-no-tool-template
purpose: Answer one bounded user request with a local model and no tools.
dar_runtime:
  distribution: dynamic-agent-runner
  required_version: 0.1.15
model:
  profile_requirement: local-general-model
skills: []
tools: []
input_contract:
  mode: hybrid
  structured_input_schema: null
  additional_context_max_bytes: 8192
  field_precedence: original_prompt
task_invocation:
  entrypoint: answer_request
  allowed_tool_ids: []
  max_total_tool_calls: 0
  allowed_structured_input_fields: []
  allowed_artifact_roles: []
  terminal_output_schema_ref: final-answer-v1
output:
  schema_ref: final-answer-v1
limits:
  max_steps: 2
