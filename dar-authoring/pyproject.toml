[project]
name = "dar-authoring"
version = "0.1.0"
description = "Codex plugin for authoring bounded Dynamic Agent Runner workflows."
requires-python = ">=3.13,<3.15,!=3.14.1"
dependencies = [
    "dynamic-agent-runner==0.1.15",
    "keyring>=25.7.0",
    "jsonschema>=4.26.0,<5.0.0",
    "PyYAML>=6.0.3",
]

[project.scripts]
dar-authoring-mcp = "dar_workflow_server.server:console_main"
dar-workflow = "dar_workflow_server.cli:console_main"
dar-workflow-run = "dar_workflow_server.cli:run_console_main"

[tool.poetry]
packages = [
    { include = "dar_workflow_server", from = "server" },
]
include = [
    { path = ".codex-plugin/plugin.json", format = ["sdist", "wheel"] },
    { path = ".mcp.json", format = ["sdist", "wheel"] },
    { path = "skills/**/*", format = ["sdist", "wheel"] },
]

[[tool.poetry.source]]
name = "global-release-pypi"
url = "https://artifactory.oci.oraclecorp.com/api/pypi/global-release-pypi/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
